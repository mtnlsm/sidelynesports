<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<title>Sidelyne Sports Overlay</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0}

/* =============== OVERLAY (transparent, for OBS / Streamlabs) =============== */
body.ov{background:transparent!important;overflow:hidden;--ac:#17934f;--bg:rgba(11,15,13,.9);--tx:#fff;--mu:rgba(255,255,255,.62);--bd:rgba(255,255,255,.14);--chip:rgba(255,255,255,.08);--sh:0 10px 34px rgba(0,0,0,.45)}
body.ov.light{--bg:rgba(255,255,255,.95);--tx:#0f1713;--mu:rgba(15,23,19,.6);--bd:rgba(15,23,19,.14);--chip:rgba(15,23,19,.06);--sh:0 10px 34px rgba(0,0,0,.28)}
#stage{position:fixed;left:50%;bottom:34px;width:920px;transform:translateX(-50%) scale(var(--s,1));transform-origin:50% 100%;display:flex;flex-direction:column-reverse;gap:10px;opacity:0;transition:opacity .5s ease;color:var(--tx)}
body.ov.top #stage{bottom:auto;top:34px;transform-origin:50% 0;flex-direction:column}
#stage.on{opacity:1}
#strip{display:flex;justify-content:center}
.bnd{font:800 14px/1 'Barlow Condensed',sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--ac);white-space:nowrap}
.ct{gap:3px!important}
.ovc{background:var(--bg);border:1px solid var(--bd);border-radius:20px;box-shadow:var(--sh);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);overflow:hidden}
.bar{display:grid;grid-template-columns:minmax(0,1fr) 270px minmax(0,1fr);align-items:stretch;height:92px}
.pkr{display:flex;align-items:center;justify-content:center;gap:18px;padding:8px 22px;border-top:1px solid var(--bd);background:var(--chip)}
.pkr>*{flex:none}
.tm{position:relative;display:flex;align-items:center;gap:14px;padding:0 22px;min-width:0}
.tm .nm,.tm .nm b,.tm .nm small{min-width:0;overflow:hidden;text-overflow:ellipsis}
.tm.h{flex-direction:row-reverse;text-align:right}
.tm .jy,.pt .jy{display:block;flex:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))}
.jy svg{display:block;width:100%;height:100%}
.tm .lgf{width:54px;height:54px;border-radius:50%;background:var(--chip);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font:800 18px 'Barlow Condensed',sans-serif;flex:none;letter-spacing:.02em}
.tm .nm{min-width:0;flex:1;display:flex;flex-direction:column;line-height:1.05}
.tm .nm b{font:800 38px/1 'Barlow Condensed',sans-serif;letter-spacing:.01em;text-transform:uppercase}
.tm .nm small{font-size:12.5px;font-weight:600;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.tm .sc{font:800 58px/1 'Barlow Condensed',sans-serif;font-variant-numeric:tabular-nums;min-width:44px;text-align:center;flex:none}
.tm .sc.bump{animation:bump .9s ease}
@keyframes bump{0%{transform:scale(1.4);color:var(--ac)}60%{color:var(--ac)}100%{transform:scale(1)}}
.tm.pk::after{content:'';position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--ac)}
.tm .tag{position:absolute;top:4px;left:22px;font:800 10px/1 'Barlow Condensed',sans-serif;letter-spacing:.14em;color:#fff;background:var(--ac);padding:3px 6px 2px;border-radius:5px}
.tm.h .tag{left:auto;right:22px}
.ct{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;border-left:1px solid var(--bd);border-right:1px solid var(--bd);background:var(--chip);padding:0 10px;text-align:center}
.pill{display:inline-flex;align-items:center;gap:7px;font:800 13px 'Barlow Condensed',sans-serif;letter-spacing:.16em;text-transform:uppercase}
.pill i{width:9px;height:9px;border-radius:50%;background:#ff3b30;box-shadow:0 0 0 0 rgba(255,59,48,.7);animation:pulse 1.6s infinite}
.pill.fin i,.pill.up i{display:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,59,48,.65)}70%{box-shadow:0 0 0 9px rgba(255,59,48,0)}100%{box-shadow:0 0 0 0 rgba(255,59,48,0)}}
.ct .clk{font:700 21px/1.05 'Barlow Condensed',sans-serif;letter-spacing:.03em;text-transform:uppercase;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sit{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--mu)}
.dia rect{fill:none;stroke:var(--mu);stroke-width:1.4}.dia rect.on{fill:var(--ac);stroke:var(--ac)}
.sit .rz{color:#ff3b30}
.strip{display:inline-flex;align-items:center;gap:16px;max-width:100%;padding:8px 26px 8px 10px;background:var(--bg);border:1px solid var(--bd);border-radius:999px;box-shadow:var(--sh);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.strip>*{flex:none}
.strip .pt,.pkr .pt{display:flex;align-items:center;gap:12px;min-width:0}
.strip .pt .k b,.pkr .pt .k b{color:var(--ac);overflow:hidden;text-overflow:ellipsis}
body.ov.light .strip .pt .k b,body.ov.light .pkr .pt .k b{filter:brightness(.8)}
.strip .pt .k small,.pkr .pt .k small{text-transform:none;letter-spacing:.04em;font-size:14px;font-weight:600}
.strip .sep,.pkr .sep{width:1px;height:30px;background:var(--bd)}
.strip .num,.pkr .num{font:700 22px 'Barlow Condensed',sans-serif;letter-spacing:.03em;color:var(--mu);white-space:nowrap}
.strip .num b,.pkr .num b{color:var(--tx);font-weight:800}
.res{display:inline-flex;align-items:center;gap:8px;font:800 20px 'Barlow Condensed',sans-serif;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.res::before{content:'';width:9px;height:9px;border-radius:50%;background:currentColor}
.res.win{color:#26c06a}
body.ov.light .res.win{color:#14803f}
body.ov.light .res.loss{color:#c62f27}.res.loss{color:#e5534b}.res.void{color:var(--mu)}
.strip.enter{animation:rise .55s cubic-bezier(.2,.8,.2,1)}
body.top .strip.enter{animation-name:drop}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes drop{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:none}}
.k{display:flex;flex-direction:column;line-height:1.05;min-width:0}
.k small{font:700 11px 'Barlow Condensed',sans-serif;letter-spacing:.15em;text-transform:uppercase;color:var(--mu)}
.k b{font:800 24px/1.1 'Barlow Condensed',sans-serif;letter-spacing:.01em;text-transform:uppercase;white-space:nowrap}
.msg{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);color:#fff;background:rgba(0,0,0,.65);padding:10px 16px;border-radius:10px;font-size:15px}

/* =============== SETUP PAGE (link builder) =============== */
body.bd{--bg:#f2f4f3;--sf:#fff;--sf2:#eef1ef;--tx:#0f1713;--mu:#6b7770;--bd:rgba(15,23,19,.1);--ab:#0e8f4a;--abx:#fff;--bad:#e5392d;background:var(--bg);color:var(--tx)}

.wrap{max-width:880px;margin:0 auto;padding:28px 18px 60px}
.hd{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.hd svg{color:var(--ab);width:34px;height:34px;border-radius:9px}
.hd h1{font:800 32px 'Barlow Condensed',sans-serif;margin:0;letter-spacing:.01em}
.sub{color:var(--mu);margin:0 0 22px;font-size:15px;line-height:1.45}
.cd{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:16px 18px;margin-bottom:14px}
.cd h2{font:800 14px 'Barlow Condensed',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);margin:0 0 12px;display:flex;align-items:center;gap:9px}
.cd h2 span{display:inline-flex;width:22px;height:22px;border-radius:50%;background:var(--ab);color:var(--abx);align-items:center;justify-content:center;font-size:13px;letter-spacing:0}
.acct{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:15px}
.btn{padding:9px 16px;border-radius:11px;font-weight:700;background:var(--ab);color:var(--abx);font-size:14px;text-decoration:none;display:inline-block}
.btn.g{background:var(--sf2);color:var(--tx);border:1px solid var(--bd)}
.btn:disabled{opacity:.45;cursor:default}
.gl{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow-y:auto}
.gr{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--bd);background:var(--sf2);text-align:left;color:inherit;width:100%}
.gr.sel{border-color:var(--ab);box-shadow:0 0 0 2px rgba(23,147,79,.2)}
.gr .sp{font:800 12px 'Barlow Condensed',sans-serif;letter-spacing:.1em;background:var(--ab);color:var(--abx);padding:3px 8px;border-radius:6px;flex:none}
.gr .t{flex:1;min-width:0;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gr .t em{font-style:normal;color:var(--mu);font-weight:700;margin:0 6px}
.gr .c{color:var(--mu);font-size:13px;flex:none}
.gr .c.lv{color:#ff3b30;font-weight:800}
.mt{color:var(--mu);font-size:14px;padding:6px 2px}
.row2{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.in{flex:1;min-width:180px;padding:9px 11px;border-radius:10px;border:1px solid var(--bd);background:var(--sf2);color:var(--tx);font:inherit;font-size:14px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.opt label.t{display:block;font-size:12px;font-weight:700;color:var(--mu);margin-bottom:6px;text-transform:uppercase;letter-spacing:.08em}
.seg{display:flex;background:var(--sf2);border-radius:10px;padding:3px;border:1px solid var(--bd)}
.seg button{flex:1;padding:7px 8px;border-radius:8px;background:none;color:var(--mu);font-weight:700;font-size:13px}
.seg button.on{background:var(--sf);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.ck{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;margin:5px 0}
.ck input{width:17px;height:17px;accent-color:var(--ab)}
input[type=range]{width:100%;accent-color:var(--ab)}
input[type=color]{width:100%;height:36px;border:1px solid var(--bd);border-radius:10px;background:var(--sf2);padding:2px}
.url{display:flex;gap:8px}
.url input{flex:1;min-width:0;padding:11px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--sf2);color:var(--tx);font:13px ui-monospace,Menlo,Consolas,monospace}
.how{margin:12px 0 0;padding-left:18px;color:var(--mu);font-size:13.5px;line-height:1.6}
.how b{color:var(--tx)}
.warn{margin-top:12px;font-size:13px;color:var(--mu);line-height:1.5}
.warn a{color:var(--bad);font-weight:700;cursor:pointer;text-decoration:underline}
.pv{position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;border:1px solid var(--bd);background:#6e7a74 repeating-conic-gradient(#8a948f 0% 25%,#5f6a65 0% 50%) 50%/22px 22px}
.pv iframe{position:absolute;left:0;top:0;width:1920px;height:1080px;border:0;transform-origin:0 0;background:transparent}
</style></head>

  mark=pat===1?`<rect x="11" y="12" width="26" height="6" fill="${p.c2}"/><rect x="11" y="12" width="26" height=".8" fill="rgba(0,0,0,.25)"/>`:pat===2?`<rect x="11" y="8" width="4.500" height="36" fill="${p.c2}"/><rect x="32.500" y="8" width="4.500" height="36" fill="${p.c2}"/>`:pat===3?`<rect x="11" y="11.500" width="26" height="2.600" fill="${p.c2}"/><rect x="11" y="16" width="26" height="2.600" fill="${p.c2}"/>`:'',
  fs=ini.length>2?10.500:13,ty=pat===1?33:pat===3?32:30;
  return `<svg width="${z}" height="${z}" viewBox="0 0 48 48" aria-hidden="true"><defs><clipPath id="jc${id}"><path d="${body}"/><polygon points="${sl}"/><polygon points="${sr}"/></clipPath><linearGradient id="jg${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".2"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".24"/></linearGradient></defs><ellipse cx="24" cy="45.500" rx="14" ry="1.800" fill="rgba(0,0,0,.22)"/><polygon points="${sl}" fill="${p.c2}"/><polygon points="${sr}" fill="${p.c2}"/><path d="${body}" fill="${p.c1}"/>${mark}<g clip-path="url(#jc${id})"><rect x="11" y="20" width="3.500" height="24" fill="rgba(0,0,0,.14)"/><rect x="33.500" y="20" width="3.500" height="24" fill="rgba(0,0,0,.14)"/><path d="M11 20L11 8M37 20L37 8" stroke="rgba(0,0,0,.25)" stroke-width=".8"/><rect x="11" y="41" width="26" height="3" fill="${p.c2}"/><rect x="11" y="41" width="26" height=".7" fill="rgba(0,0,0,.25)"/><path d="M3.800 20.400L8.600 23.300M5.200 18.400L10 21.300M44.200 20.400L39.400 23.300M42.800 18.400L38 21.300" stroke="${p.c1}" stroke-width="1.600" stroke-linecap="round"/><rect width="48" height="48" fill="url(#jg${id})"/></g><path d="M18 4Q24 14 30 4Z" fill="rgba(0,0,0,.35)"/><path d="M17.200 4Q24 15.500 30.800 4" fill="none" stroke="${p.c2}" stroke-width="2.600" stroke-linecap="round"/><path d="M17.200 4Q24 15.500 30.800 4" fill="none" stroke="rgba(0,0,0,.25)" stroke-width=".6"/><path d="${body}" fill="none" stroke="rgba(0,0,0,.35)" stroke-width=".8" stroke-linejoin="round"/><polygon points="${sl}" fill="none" stroke="rgba(0,0,0,.35)" stroke-width=".8" stroke-linejoin="round"/><polygon points="${sr}" fill="none" stroke="rgba(0,0,0,.35)" stroke-width=".8" stroke-linejoin="round"/><text x="24" y="${ty}" text-anchor="middle" font-size="${fs}" font-weight="900" fill="${ink}" font-family="'Arial Narrow','Helvetica Neue',Arial,sans-serif" letter-spacing=".3">${ini}</text></svg>`};
    const jersey = (t, z, sp) => { try { return `<span class="jy" style="width:${z}px;height:${z}px">${jerseySvg(t.n || t.ab || '?', z, sp, t.ab)}</span>`; } catch (e) { return `<div class="lgf">${E((t.ab || t.n || '?').slice(0, 3))}</div>`; } };
  const hex = (v) => (/^[0-9a-f]{6}$/i.test(v || '') ? v.replace('#', '') : DEF);
  if (P.get('game')) overlay(); else builder();

  // ---------------------------------------------------------------- OVERLAY
  function overlay() {
    const B = document.body; B.className = 'ov' + (P.get('theme') === 'light' ? ' light' : '') + (P.get('pos') === 'top' ? ' top' : '');
    document.getElementById('app').remove();
    const GAME = P.get('game'), KEY = P.get('key') || '';
    const show = (P.get('show') || 'score,pick').split(',');
    const wantScore = show.includes('score'), wantPick = show.includes('pick') && !!KEY;
    const logos = P.get('logos') !== '0', mult = Math.min(3, Math.max(0.4, parseFloat(P.get('scale')) || 1));
    B.style.setProperty('--ac', '#' + hex(P.get('accent')));
    const stage = document.getElementById('stage'), barEl = document.getElementById('bar'), stripEl = document.getElementById('strip');
    const fit = () => stage.style.setProperty('--s', String(Math.min(innerWidth * 0.99 / 920, Math.max(0.2, innerWidth * 0.94 / 920 * Math.min(1, mult)))));
    fit(); addEventListener('resize', fit);

    let D = null, K = null, prev = { a: null, b: null }, barSig = '', stripSig = '', stripHad = false;
    const norm = (s) => String(s || '').toLowerCase().replace(/[^a-z0-9 ]/g, '').trim();
    const match = (t, s) => { const n = norm(s.n), ab = norm(s.ab); if (!t) return 0; if (t === n || t === ab) return 3; if (n && (t.includes(n) || n.includes(t))) return 2; if (ab.length > 2 && t.split(' ').includes(ab)) return 1; return 0; };
    function sideOf() {
      if (!K || !K.pick || !D) return null;
      if (K.pick.side === 'a') return 'a'; if (K.pick.side === 'b') return 'b';
      const t = norm(K.pick.team), a = match(t, D.away), b = match(t, D.home);
      return a > b ? 'a' : b > a ? 'b' : null;
    }
    const logo = (s) => (logos ? jersey(s, 66, D && D.sp) : `<div class="lgf">${E((s.ab || s.n || '?').slice(0, 3))}</div>`);
    const dia = (s) => { const b = (x, y, on) => `<rect x="${x - 5}" y="${y - 5}" width="10" height="10" transform="rotate(45 ${x} ${y})" class="${on ? 'on' : ''}"/>`; return `<svg class="dia" viewBox="0 0 48 40" width="38" height="32" aria-hidden="true">${b(24, 9, s.r2)}${b(39, 22, s.r1)}${b(9, 22, s.r3)}</svg>`; };
    function sit(d) {
      const s = d.sit; if (!s || d.st !== 'live') return '';
      if (s.k === 'b') return `<div class="sit">${dia(s)}<span>${s.o} out${s.o === 1 ? '' : 's'}<br>${s.ba}-${s.sk}</span></div>`;
      if (s.k === 'f' && s.dd) return `<div class="sit"><span>${E(s.dd)}${s.rz ? ' <b class="rz">RZ</b>' : ''}</span></div>`;
      return '';
    }

    // pick content (jersey, team, stake and result), shown INSIDE the scoreboard card, or as a small pill when the score bar is off
    function pickInner(size) {
      const k = K && K.pick; if (!wantPick || !k) return '';
      const u = K.user || {}, sd = sideOf(), side = D && sd ? (sd === 'a' ? D.away : D.home) : null;
      const pay = k.stake > 0 && k.mult ? Math.round(k.stake * Number(k.mult)) : 0;
      const res = k.result === 'win' ? `<span class="res win">Correct${k.awarded ? ' +' + Number(k.awarded).toLocaleString() + ' SP' : ''}</span>` : k.result === 'loss' ? '<span class="res loss">Missed</span>' : k.result === 'void' ? '<span class="res void">Void</span>' : '';
      const num = k.stake > 0 ? `<div class="num"><b>${Number(k.stake).toLocaleString()}</b> SP${pay && !res ? ` &rarr; <b>${pay.toLocaleString()}</b> SP` : ''}</div>` : '';
      return `<div class="pt">${logos && side ? jersey(side, size, D && D.sp) : ''}<div class="k"><small>@${E(u.username || u.name || 'fan')}&rsquo;s pick</small><b>${E(k.team)}</b></div></div>${num || res ? '<div class="sep"></div>' : ''}${num}${res}`;
    }

    function drawBar() {
      if (!wantScore || !D) { barEl.innerHTML = ''; return; }
      const d = D, sd = sideOf(), sa = d.away.sc, sb = d.home.sc;
      const pk = pickInner(38), sig = JSON.stringify([d.away.ab, d.home.ab, sa, sb, d.st, d.clk, d.sit, sd, logos, pk]);
      if (sig === barSig) return; barSig = sig;
      const bumpA = prev.a !== null && sa !== prev.a ? ' bump' : '', bumpB = prev.b !== null && sb !== prev.b ? ' bump' : '';
      prev = { a: sa, b: sb };
      const pill = d.st === 'live' ? '<span class="pill"><i></i>Live</span>' : d.st === 'final' ? '<span class="pill fin">Final</span>' : '<span class="pill up">Upcoming</span>';
      const clk = d.st === 'final' ? '' : d.clk;
      barEl.innerHTML = `<div class="ovc"><div class="bar"><div class="tm a${sd === 'a' ? ' pk' : ''}">${sd === 'a' ? '<span class="tag">PICK</span>' : ''}${logo(d.away)}<div class="nm"><b>${E(d.away.ab || d.away.n)}</b><small>${E(d.away.n)}</small></div><div class="sc${bumpA}">${E(sa === '' ? '–' : sa)}</div></div>
        <div class="ct"><span class="bnd">Sidelyne Sports</span>${pill}${clk ? `<div class="clk">${E(clk)}</div>` : ''}${sit(d)}</div>
        <div class="tm h${sd === 'b' ? ' pk' : ''}">${sd === 'b' ? '<span class="tag">PICK</span>' : ''}${logo(d.home)}<div class="nm"><b>${E(d.home.ab || d.home.n)}</b><small>${E(d.home.n)}</small></div><div class="sc${bumpB}">${E(sb === '' ? '–' : sb)}</div></div></div>${pk ? `<div class="pkr">${pk}</div>` : ''}</div>`;
    }

    const hue = (s) => { let h = 0; for (const c of String(s || '')) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
    function drawStrip() {
      const inner = wantScore ? '' : pickInner(44);
      if (!inner) { stripEl.innerHTML = ''; stripHad = false; stripSig = ''; return; }
      if (inner === stripSig) return; stripSig = inner;
      stripEl.innerHTML = `<div class="strip${stripHad ? '' : ' enter'}">${inner}<div class="sep"></div><div class="k"><span class="bnd">Sidelyne<br>Sports</span></div></div>`;
      stripHad = true;
    }

    const paint = () => { drawBar(); drawStrip(); if (D) stage.classList.add('on'); };
    async function pullGame() {
      try { const r = await fetch('/.netlify/functions/game-detail?id=' + encodeURIComponent(GAME), { cache: 'no-store' }); if (r.ok) { D = await r.json(); paint(); } } catch (e) {}
    }
    async function pullPick() {
      if (!wantPick || typeof FX_SUPABASE_URL === 'undefined') return;
      try {
        const r = await fetch(FX_SUPABASE_URL + '/rest/v1/rpc/overlay_pick', { method: 'POST', headers: { apikey: FX_SUPABASE_KEY, Authorization: 'Bearer ' + FX_SUPABASE_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ p_key: KEY, p_game: GAME }) });
        if (r.ok) { K = await r.json(); paint(); }
      } catch (e) {}
    }
    pullGame(); pullPick();
    setInterval(pullGame, 8000); setInterval(pullPick, 12000);
  }

  // ---------------------------------------------------------------- SETUP / LINK BUILDER
  function builder() {
    document.body.className = 'bd';
    document.getElementById('stage').remove();
    const app = document.getElementById('app');
    const S = { games: [], gid: (/^[A-Z0-9]+:\d{3,}$/.test(P.get('setup') || '') ? P.get('setup') : ''), all: !!P.get('setup'), key: '', user: null, signed: null, show: { score: true, pick: true }, theme: 'dark', pos: 'bottom', scale: 1, logos: true, accent: '#' + DEF, q: '' };
    app.innerHTML = `<div class="wrap"><div class="hd"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="currentColor"/><path d="M22 10.5h-9.5a3.5 3.5 0 0 0 0 7h7a3.5 3.5 0 0 1 0 7H10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg><h1>Stream Overlay</h1></div>
      <p class="sub">A live scoreboard with your pick, for OBS, Streamlabs Desktop and any streaming software with a Browser Source. Your pick only appears on the overlay when you've made one on that game.</p>
      <div class="cd"><h2><span>1</span>Your account</h2><div class="acct" id="acct">Checking sign-in\u2026</div></div>
      <div class="cd"><h2><span>2</span>Choose a game</h2><div class="gl" id="gl"><div class="mt">Loading games\u2026</div></div>
        <div class="row2"><input class="in" id="gid" placeholder="or paste a game ID (e.g. MLB:401234567)" autocomplete="off"><label class="ck" style="margin:0"><input type="checkbox" id="all"> Include upcoming games</label></div></div>
      <div class="cd"><h2><span>3</span>Customize</h2><div class="opts">
        <div class="opt"><label class="t">Show</label><label class="ck"><input type="checkbox" id="oS" checked> Score bar</label><label class="ck"><input type="checkbox" id="oP" checked> My pick</label><label class="ck"><input type="checkbox" id="oL" checked> Team jerseys</label></div>
        <div class="opt"><label class="t">Theme</label><div class="seg" id="oT"><button data-v="dark" class="on">Dark</button><button data-v="light">Light</button></div><label class="t" style="margin-top:12px">Position</label><div class="seg" id="oPos"><button data-v="bottom" class="on">Bottom</button><button data-v="top">Top</button></div></div>
        <div class="opt"><label class="t">Size <span id="oZv" style="text-transform:none;letter-spacing:0">100%</span></label><input type="range" id="oZ" min="40" max="100" value="100"><label class="t" style="margin-top:12px">Accent color</label><input type="color" id="oC" value="#${DEF}"></div></div></div>
      <div class="cd"><h2><span>4</span>Your overlay link</h2><div class="url"><input id="url" readonly placeholder="Choose a game to generate your link"><button class="btn" id="cp" disabled>Copy</button></div>
        <ol class="how"><li><b>OBS:</b> Sources \u2192 + \u2192 <b>Browser</b>. <b>Streamlabs Desktop:</b> + \u2192 <b>Browser Source</b>.</li><li>Paste the link into the URL field. Set <b>Width 1920</b> and <b>Height 1080</b>.</li><li>Leave the custom CSS empty. The background is already transparent.</li></ol>
        <div class="warn" id="warn"></div></div>
      <div class="cd"><h2>Preview</h2><div class="pv" id="pv"><iframe id="pf" title="Overlay preview"></iframe></div></div></div>`;
    const $ = (s) => app.querySelector(s);

    function url() {
      if (!S.gid) return '';
      const q = ['game=' + encodeURIComponent(S.gid)];
      if (S.show.pick && S.key) q.push('key=' + S.key);
      if (!(S.show.score && S.show.pick)) q.push('show=' + [S.show.score ? 'score' : '', S.show.pick ? 'pick' : ''].filter(Boolean).join(','));
      if (S.theme === 'light') q.push('theme=light'); if (S.pos === 'top') q.push('pos=top');
      if (S.scale !== 1) q.push('scale=' + S.scale); if (!S.logos) q.push('logos=0');
      if (S.accent.replace('#', '').toLowerCase() !== DEF) q.push('accent=' + S.accent.replace('#', ''));
      return location.origin + '/overlay.html?' + q.join('&');
    }
    let lastPv = '';
    function sync() {
      const u = url(), needKey = S.show.pick && !S.key;
      $('#url').value = u; $('#cp').disabled = !u || needKey;
      $('#url').placeholder = S.gid ? 'Sign in to generate your link' : 'Choose a game to generate your link';
      if (needKey && S.gid) $('#url').value = '';
      $('#warn').innerHTML = S.key && S.show.pick ? 'This link contains your private overlay key, so anyone who has it can see your picks on the games it covers. Don\u2019t show it on stream. <a id="rk">Reset my key</a> if it leaks (old links stop showing your pick).' : '';
      const rk = $('#rk'); if (rk) rk.onclick = async () => { if (!confirm('Reset your overlay key? Every overlay link you made will stop showing your pick until you copy a new one.')) return; const r = await FX_DB.rpc('my_overlay_key', { p_reset: true }); if (!r.error && r.data) { S.key = r.data; sync(); } };
      const pf = $('#pf'), pu = u && !needKey ? u : '';
      if (pu !== lastPv) { lastPv = pu; pf.src = pu || 'about:blank'; }
    }
    const fitPv = () => { const w = $('#pv').clientWidth; $('#pf').style.transform = 'scale(' + (w / 1920) + ')'; };
    new ResizeObserver(fitPv).observe($('#pv')); fitPv();

    function games() {
      const g = S.games.filter((x) => x.st === 'live' || (S.all && x.st === 'up'));
      const gl = $('#gl');
      if (!g.length) { gl.innerHTML = '<div class="mt">' + (S.games.length ? 'No live games right now. Tick \u201cInclude upcoming games\u201d to set up ahead of time.' : 'Couldn\u2019t load games. You can still paste a game ID below.') + '</div>'; return; }
      gl.innerHTML = g.map((x) => `<button class="gr${x.id === S.gid ? ' sel' : ''}" data-id="${E(x.id)}"><span class="sp">${E(x.sp)}</span><span class="t">${E(x.a)}<em>${x.st === 'live' ? E(x.sa) + ' \u2013 ' + E(x.sb) : 'vs'}</em>${E(x.b)}</span><span class="c${x.st === 'live' ? ' lv' : ''}">${x.st === 'live' ? 'LIVE \u00b7 ' + E(x.clk || '') : E(new Date(x.date).toLocaleString([], { weekday: 'short', hour: 'numeric', minute: '2-digit' }))}</span></button>`).join('');
    }
    $('#gl').onclick = (e) => { const b = e.target.closest('[data-id]'); if (!b) return; S.gid = b.dataset.id; $('#gid').value = ''; games(); sync(); };
    $('#gid').oninput = (e) => { const v = e.target.value.trim(); if (/^[A-Z0-9]+:\d{3,}$/.test(v)) { S.gid = v; games(); sync(); } };
    $('#all').onchange = (e) => { S.all = e.target.checked; games(); };
    if (S.all) $('#all').checked = true;
    $('#oS').onchange = (e) => { S.show.score = e.target.checked; sync(); }; $('#oP').onchange = (e) => { S.show.pick = e.target.checked; sync(); }; $('#oL').onchange = (e) => { S.logos = e.target.checked; sync(); };
    $('#oZ').oninput = (e) => { S.scale = +e.target.value / 100; $('#oZv').textContent = e.target.value + '%'; sync(); };
    $('#oC').oninput = (e) => { S.accent = e.target.value; sync(); };
    const seg = (id, k) => { $(id).onclick = (e) => { const b = e.target.closest('button'); if (!b) return; S[k] = b.dataset.v; $(id).querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b)); sync(); }; };
    seg('#oT', 'theme'); seg('#oPos', 'pos');
    $('#cp').onclick = async () => { const i = $('#url'); try { await navigator.clipboard.writeText(i.value); } catch (e) { i.select(); document.execCommand('copy'); } $('#cp').textContent = 'Copied!'; setTimeout(() => { $('#cp').textContent = 'Copy'; }, 1600); };

    fetch('/.netlify/functions/sports-data?sport=ALL&type=games', { cache: 'no-store' }).then((r) => r.json()).then((r) => {
      S.games = (r.items || []).filter((g) => g && g.sp !== 'UFC' && g.sp !== 'PFL' && /^[A-Z0-9]+:\d{3,}$/.test(String(g.id))); games();
    }).catch(() => { games(); });

    const lib = () => new Promise((res) => { if (window.supabase) return res(); const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'; s.onload = res; s.onerror = res; document.head.appendChild(s); });
    (async () => {
      const acct = $('#acct');
      try {
        await lib(); await window.fxInitSupabase();
        const { data } = await FX_DB.auth.getSession();
        if (!data || !data.session) throw 0;
        const uid = data.session.user.id;
        const [k, p] = await Promise.all([FX_DB.rpc('my_overlay_key'), FX_DB.from('profiles').select('username,display_name').eq('id', uid).maybeSingle()]);
        if (k.error || !k.data) throw 1;
        S.key = k.data; S.user = p && p.data;
        acct.innerHTML = `<span>Signed in as <b>@${E((S.user && S.user.username) || 'you')}</b></span><span class="mt" style="padding:0">Your pick will show on the overlay.</span>`;
      } catch (e) {
        acct.innerHTML = '<span>Sign in to Sidelyne Sports to show your picks on the overlay.</span><a class="btn" href="/">Sign in</a>';
        S.show.pick = false; $('#oP').checked = false;
      }
      sync();
    })();
  }
})();
</script></body></html>
